services:
  # Spring Boot Backend
  - type: web
    name: medchain-backend
    env: docker
    dockerfilePath: medchain-backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: medchain-db
          property: connectionString
      - key: MEDCHAIN_JWT_SECRET
        generateValue: true
      - key: MEDCHAIN_AI_SERVICE_URL
        fromService:
          type: web
          name: medchain-ai-service
          property: host
      - key: MEDCHAIN_BLOCKCHAIN_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "http://localhost:*,https://*.vercel.app,https://*.onrender.com"

  # FastAPI AI Intelligence Microservice
  - type: web
    name: medchain-ai-service
    env: docker
    dockerfilePath: medchain-ai-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL
  - name: medchain-db
    plan: free
    region: oregon
    databaseName: medchain
    user: medchain
